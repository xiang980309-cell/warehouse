let labelPriceTab = 'all';
function rLabelPrice() {
  return '<div class="pnl"><div class="pnH"><span class="pnT">🏷️ ' + t('labelPrice') + '</span><span style="font-size:.65rem;color:var(--t3)">' + t('labelPriceHint') + '</span></div><div class="pnB" id="labelPriceArea"><div class="spinner"></div></div></div>';
}

let labelSelected = new Set();
let labelPricePg = 1;
let labelPriceSize = 12;
let lpCat1 = 'all';
let lpCat2 = 'all';
let lpCat3 = 'all';
let labelPriceCat = 'all';




function loadLabelPrices() {
  const area = document.getElementById('labelPriceArea');
  if (!area) return;
  const labels = ['novo', 'oferta', 'promocao'];
  let list = DB.prods.filter(p => labels.includes(p.label || 'normal'));
  const catRoot = (typeof lpCat1 !== 'undefined' && lpCat1 && lpCat1 !== 'all') ? Number(lpCat1) : null;
  const catSub = (typeof lpCat2 !== 'undefined' && lpCat2 && lpCat2 !== 'all') ? Number(lpCat2) : null;
  const catSub2 = (typeof lpCat3 !== 'undefined' && lpCat3 && lpCat3 !== 'all') ? Number(lpCat3) : null;
  const filterCatId = catSub2 || catSub || catRoot;
  if (filterCatId) {
    const catIds = new Set([filterCatId]);
    (function addDescendants(pid) {
      DB.cats.filter(x => Number(x.parent_id) === Number(pid)).forEach(x => {
        catIds.add(Number(x.id));
        addDescendants(x.id);
      });
    })(filterCatId);
    list = list.filter(prod => (prod.catIds || []).some(cid => catIds.has(Number(cid))));
  }
  const shownAll = labelPriceTab === 'all' ? list : list.filter(p => p.label === labelPriceTab);
  const total = shownAll.length;
  const size = labelPriceSize || 12;
  const pages = Math.max(1, Math.ceil(total / size));
  if (labelPricePg > pages) labelPricePg = pages;
  const shown = shownAll.slice((labelPricePg - 1) * size, labelPricePg * size);
  [...labelSelected].forEach(id => { if (!shown.some(p => p.id === id)) labelSelected.delete(id); });

  const ctl = 'height:36px;box-sizing:border-box;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.03);padding:0 .7rem;color:var(--t1);font-size:.8rem';
  const chip = (on, txt, fn) => '<button class="btn bs" style="height:32px;padding:0 .8rem;border-radius:999px;flex:0 0 auto;border:1px solid ' + (on ? 'transparent' : 'var(--bd)') + ';background:' + (on ? 'var(--ac)' : 'rgba(255,255,255,.03)') + ';color:' + (on ? '#fff' : 'var(--t2)') + ';font-size:.75rem;font-weight:600" onclick="' + fn + '">' + txt + '</button>';

  let html = '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.55rem .65rem;border:1px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.025);margin-bottom:.75rem">';
  html += chip(labelPriceTab === 'all', t('labelFilterAll') + ' (' + list.length + ')', "labelPriceTab='all';labelPricePg=1;loadLabelPrices()");
  labels.forEach(l => {
    const n = list.filter(p => p.label === l).length;
    html += chip(labelPriceTab === l, labelText(l) + ' (' + n + ')', "labelPriceTab='" + l + "';labelPricePg=1;loadLabelPrices()");
  });
  html += '<span style="width:1px;height:22px;background:var(--bd);margin:0 .15rem"></span>';
  const topCats = DB.cats.filter(function(x){ return x.parent_id === null; }).sort(function(a,b){ return a.order - b.order; });
  html += '<select onchange="lpCat1=this.value;lpCat2=\'all\';labelPricePg=1;loadLabelPrices()" style="' + ctl + ';min-width:130px">';
  html += '<option value="all"' + ((!lpCat1 || lpCat1 === 'all') ? ' selected' : '') + '>' + t('all') + '</option>';
  topCats.forEach(function(x) {
    html += '<option value="' + x.id + '"' + (String(lpCat1) === String(x.id) ? ' selected' : '') + '>' + x.icon + ' ' + esc(x.name) + '</option>';
  });
  html += '</select>';
  if (lpCat1 && lpCat1 !== 'all') {
    const kids = DB.cats.filter(function(x){ return Number(x.parent_id) === Number(lpCat1); }).sort(function(a,b){ return a.order - b.order; });
    if (kids.length) {
      html += '<select onchange="lpCat2=this.value;labelPricePg=1;loadLabelPrices()" style="' + ctl + ';min-width:120px">';
      html += '<option value="all">' + t('allSubCats') + '</option>';
      kids.forEach(function(x) {
        html += '<option value="' + x.id + '"' + (String(lpCat2) === String(x.id) ? ' selected' : '') + '>' + x.icon + ' ' + esc(x.name) + '</option>';
      });
      html += '</select>';
    }
    if (lpCat2 && lpCat2 !== 'all') {
      const kids2 = DB.cats.filter(function(x){ return Number(x.parent_id) === Number(lpCat2); }).sort(function(a,b){ return a.order - b.order; });
      if (kids2.length) {
        html += '<select onchange="lpCat3=this.value;labelPricePg=1;loadLabelPrices()" style="' + ctl + ';min-width:120px">';
        html += '<option value="all">' + t('allSubCats') + '</option>';
        kids2.forEach(function(x) {
          html += '<option value="' + x.id + '"' + (String(lpCat3) === String(x.id) ? ' selected' : '') + '>' + x.icon + ' ' + esc(x.name) + '</option>';
        });
        html += '</select>';
      }
    }
  }
  html += '<span style="width:1px;height:22px;background:var(--bd);margin:0 .15rem"></span>';
  html += '<label style="display:flex;align-items:center;gap:.35rem;cursor:pointer;font-size:.75rem;color:var(--t2);height:36px"><input type="checkbox" ' + (shown.length && shown.every(p => labelSelected.has(p.id)) ? 'checked' : '') + ' onchange="toggleAllLabelPrice(this.checked)" style="width:16px;height:16px" /> ' + t('selectAll') + '</label>';
  html += '<span style="font-size:.72rem;color:var(--t3);height:36px;display:flex;align-items:center">' + t('selectedCount').replace('{0}', labelSelected.size) + '</span>';
  html += '<span style="margin-left:auto;display:flex;align-items:center;gap:.35rem;height:36px">';
  html += '<input type="number" min="0" step="0.01" id="bulk_sel" placeholder="0" style="' + ctl + ';width:96px" />';
  html += '<button class="btn bp bs" style="height:36px;padding:0 .9rem;border-radius:10px;font-size:.78rem" onclick="applySelectedLabelPrice()">' + t('applySelected') + '</button>';
  html += '</span></div>';

  html += '<div class="pcards">';
  shown.sort((a, b) => (a.label || '').localeCompare(b.label || '') || (a.name || '').localeCompare(b.name || ''));
  shown.forEach(p => {
    const lv = p.stock === 0 ? 'lo' : p.stock <= 10 ? 'md' : 'hi';
    const lvC = lv === 'lo' ? 'dg' : lv === 'md' ? 'wa' : 'sf';
    const sel = labelSelected.has(p.id);
    html += '<div class="pcard" style="cursor:default;display:flex;gap:.75rem;align-items:center;padding:.85rem 1rem">'
      + '<input type="checkbox" ' + (sel ? 'checked' : '') + ' style="flex-shrink:0;cursor:pointer" onchange="toggleLabelSelect(' + p.id + ', this.checked)" />'
      + '<div class="pimg" style="width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center">' + (p.img ? '<img src="' + safeUrl(p.img) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px" onerror="this.remove()">' : '') + '</div>'
      + '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:.28rem">'
      + '<div class="pdl"><span class="pdk" style="min-width:3.2em;flex-shrink:0">' + t('cName') + '：</span><span class="pdv" style="flex:1;min-width:0">' + esc(p.name) + ' ' + labelBadge(p.label) + '</span></div>'
      + '<div class="pdl"><span class="pdk" style="min-width:3.2em;flex-shrink:0">' + t('cSku') + '：</span><span class="pdv mono">' + esc(p.sku) + '</span></div>'
      + '<div class="pdl" style="align-items:center"><span class="pdk" style="min-width:3.2em;flex-shrink:0">' + t('cPrice') + '：</span><span class="pdv mono">¥' + Number(p.price || 0).toLocaleString() + '</span>'
      + '<span style="font-size:.68rem;color:var(--t3);margin-left:.55rem">' + t('discountPrice') + '</span>'
      + '<input type="number" min="0" step="0.01" id="lp_' + p.id + '" value="' + (p.lp == null ? '' : p.lp) + '" placeholder="—" style="width:104px;margin-left:.35rem" />'
      + '<span style="font-size:.62rem;color:var(--t3);margin-left:.35rem">' + (p.lp == null ? t('labelPriceEmpty') : t('labelPriceKeep')) + '</span>'
      + '</div>'
      + '<div class="pdl"><span class="pdk" style="min-width:3.2em;flex-shrink:0">' + t('cStock') + '：</span><span class="pdv mono" style="color:var(--' + lvC + ')">' + p.stock + '</span></div>'
      + '</div></div>';
  });
  if (!shown.length) html += '<div class="empty"><p>' + t('noMatchProduct') + '</p></div>';
  html += '</div>';

  // pager
  if (total > size) {
    html += '<div style="display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-top:.9rem">';
    html += '<button class="btn bg bs" style="height:34px;padding:0 .85rem' + (labelPricePg <= 1 ? ';opacity:.4' : '') + '"' + (labelPricePg <= 1 ? ' disabled' : '') + ' onclick="labelPricePg--;loadLabelPrices()">' + (t('prev') || '‹') + '</button>';
    html += '<span style="font-size:.78rem;color:var(--t2)">' + labelPricePg + ' / ' + pages + ' · ' + total + '</span>';
    html += '<button class="btn bg bs" style="height:34px;padding:0 .85rem' + (labelPricePg >= pages ? ';opacity:.4' : '') + '"' + (labelPricePg >= pages ? ' disabled' : '') + ' onclick="labelPricePg++;loadLabelPrices()">' + (t('next') || '›') + '</button>';
    html += '<span style="margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--t3)">' + (t('pgSize') || 'Size')
      + '<select onchange="labelPriceSize=Number(this.value);labelPricePg=1;loadLabelPrices()" style="' + ctl + ';height:34px;min-width:72px">'
      + [12, 24, 48].map(n => '<option value="' + n + '"' + (labelPriceSize === n ? ' selected' : '') + '>' + n + '</option>').join('')
      + '</select></span>';
    html += '</div>';
  }

  html += '<div style="display:flex;justify-content:flex-end;margin-top:.9rem"><button class="btn bp bs aw" style="height:40px;padding:0 1.15rem" onclick="saveLabelPrices()">' + t('savePrices') + '</button></div>';
  area.innerHTML = html;
}
function toggleLabelSelect(id, on) {
  if (on) labelSelected.add(id); else labelSelected.delete(id);
  const el = document.getElementById('labelPriceArea');
  if (el) {
    const box = el.querySelector('div[style*="已选"], div[style*="color:var(--t2)"] span');
    // light update of count without full rerender
    const spans = el.querySelectorAll('span');
    for (const s of spans) {
      if (s.textContent && (s.textContent.indexOf('已选') >= 0 || s.textContent.indexOf('Selecionados') >= 0)) {
        s.textContent = t('selectedCount').replace('{0}', labelSelected.size);
        break;
      }
    }
  }
}
function toggleAllLabelPrice(on) {
  const labels = ['novo', 'oferta', 'promocao'];
  const list = DB.prods.filter(p => labels.includes(p.label || 'normal'));
  const shown = labelPriceTab === 'all' ? list : list.filter(p => p.label === labelPriceTab);
  shown.forEach(p => { if (on) labelSelected.add(p.id); else labelSelected.delete(p.id); });
  loadLabelPrices();
}
async function applySelectedLabelPrice() {
  const input = document.getElementById('bulk_sel');
  const val = Number(input && input.value);
  if (!input || isNaN(val) || val < 0) { toast(t('cPrice'), 'er'); return; }
  if (!labelSelected.size) { toast(t('selectCategoryFirst'), 'er'); return; }
  labelSelected.forEach(id => {
    const p = DB.prods.find(x => x.id === id);
    if (p) p.lp = val;
    const el = document.getElementById('lp_' + id);
    if (el) el.value = val;
  });
  toast(t('priceUpdated'), 'ok');
}
async function applyBulkLabelPrice(label) {
  const input = document.getElementById('bulk_' + label);
  const val = Number(input && input.value);
  if (!input || isNaN(val) || val < 0) { toast(t('enterPriceErr') || t('cPrice'), 'er'); return; }
  DB.prods.filter(p => (p.label || 'normal') === label).forEach(p => {
    p.lp = val;
    const el = document.getElementById('lp_' + p.id);
    if (el) el.value = val;
  });
  toast(t('priceUpdated'), 'ok');
}
async function saveLabelPrices() {
  const labels = ['novo', 'oferta', 'promocao'];
  const targets = DB.prods.filter(p => labels.includes(p.label || 'normal'));
  try {
    let n = 0;
    for (const p of targets) {
      const el = document.getElementById('lp_' + p.id);
      const raw = el ? String(el.value).trim() : '';
      const price = raw === '' ? null : Number(raw);
      if (price != null && (isNaN(price) || price < 0)) continue;
      if ((p.lp == null ? null : Number(p.lp)) === price) continue;
      await adminApi('update', { table: 'products', patch: { label_price: price }, where: { id: p.id } });
      p.lp = price;
      n++;
    }
    toast(t('priceUpdated') + ' (' + n + ')', 'ok');
  } catch (e) {
    toast(t('saveFailed') + ': ' + e.message, 'er');
  }
}
function billOrdAmount(o) {
  if (!o) return '0.00';
  if (o.origTotal) return Number(o.origTotal).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const goods = (o.items || []).reduce(function(s, i) {
    const p = prodById(i.pid);
    return s + (p ? Number(p.price) * Number(i.qty || 0) : 0);
  }, 0);
  const total = goods + Number(o.shipCost || 0);
  return total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function billOrdAmount(o) {
  if (!o) return 0;
  if (o.origTotal) return Number(o.origTotal) || 0;
  const goods = (o.items || []).reduce(function(s, i) {
    const p = prodById(i.pid);
    return s + (p ? Number(p.price) * Number(i.qty || 0) : 0);
  }, 0);
  return goods + Number(o.shipCost || 0);
}

function billOrdAmountStr(o) {
  return billOrdAmount(o).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function rBillReview() {
  const all = (DB.ords || []).filter(o => o.st !== 'cancel');
  const pend = all.filter(o => o.payS === 'pending' || o.payS === 'pending_bill');
  const done = all.filter(o => o.payS === 'confirmed' || o.payS === 'rejected');

  function rowHtml(o) {
    const paySc = PSTAT[o.payS] || {};
    const img = o.payI || o.bi || '';
    const thumb = img
      ? '<img src="' + safeUrl(img) + '" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer;flex-shrink:0" />'
      : '<div style="width:56px;height:56px;border-radius:8px;border:1px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--t3);flex-shrink:0">-</div>';
    return '<div style="padding:.75rem 0;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:.75rem;cursor:pointer" onclick="openBillDetail(' + o.id + ')">'
      + thumb
      + '<div style="flex:1;min-width:0">'
      + '<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap"><strong>' + esc(o.no) + '</strong>'
      + (o.src === 'shop' ? ' <span class="badge b-st">商城</span>' : '')
      + '<span class="badge ' + paySc.c + '">' + t(paySc.l || 'pendingConfirm') + '</span></div>'
      + '<div style="font-size:.72rem;color:var(--t2);margin-top:.2rem">' + esc(o.by || '') + ' · ' + esc(o.cr || '') + '</div>'
      + '<div style="font-family:DM Mono,monospace;font-weight:600;margin-top:.3rem;color:var(--ac)">¥' + billOrdAmountStr(o) + '</div>'
      + '</div>'
      + '<div style="color:var(--t3);flex-shrink:0">›</div>'
      + '</div>';
  }

  return ''
    + '<div class="pnl"><div class="pnH"><span class="pnT">🧾 ' + t('billReview') + '</span><span style="font-size:.65rem;color:var(--t3)">' + t('billReviewHint') + '</span></div>'
    + '<div class="pnB">'
    + '<div style="font-size:.85rem;font-weight:600;margin:.25rem 0 .55rem">' + t('billPendingReview') + ' <span class="badge b-pd">' + pend.length + '</span></div>'
    + (pend.length ? pend.map(function(o){ return rowHtml(o); }).join('') : '<div class="empty"><p>' + t('noPendingCus') + '</p></div>')
    + '<div style="font-size:.85rem;font-weight:600;margin:1.15rem 0 .55rem">' + t('billReviewed') + ' <span class="badge b-dn">' + done.length + '</span></div>'
    + (done.length ? done.map(function(o){ return rowHtml(o); }).join('') : '<div class="empty"><p>' + t('noPendingCus') + '</p></div>')
    + '</div></div>';
}

function openBillImg(src) {
  if (!src) return;
  let el = document.getElementById('billLightbox');
  if (!el) {
    el = document.createElement('div');
    el.id = 'billLightbox';
    el.style.cssText = 'position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;cursor:zoom-out';
    el.onclick = function() { el.style.display = 'none'; };
    document.body.appendChild(el);
  }
  el.innerHTML = '<img src="' + src + '" style="max-width:92vw;max-height:88vh;border-radius:10px;background:#fff;padding:6px" />';
  el.style.display = 'flex';
}

function openBillDetail(id) {
  const o = DB.ords.find(x => x.id === id);
  if (!o) return;
  document.getElementById('payOid').value = id;
  const img = o.payI || o.bi || '';
  const paySc = PSTAT[o.payS] || {};
  const amt = billOrdAmount(o);
  const reviewed = (o.payS === 'confirmed' || o.payS === 'rejected');
  let info = '<div style="font-size:.82rem;line-height:1.6">'
    + '<strong>' + t('orderNo') + ':</strong> ' + esc(o.no)
    + (o.src === 'shop' ? ' <span class="badge b-st">商城</span>' : '')
    + '<br><strong>' + t('payment') + ':</strong> <span class="badge ' + paySc.c + '">' + t(paySc.l || 'pendingConfirm') + '</span>'
    + '<br><strong>' + t('createdAt') + ':</strong> ' + esc(o.cr || '')
    + '<br><strong>' + t('creator') + ':</strong> ' + esc(o.by || '')
    + '<br><strong>' + t('orderAmount') + ':</strong> <span style="font-family:DM Mono,monospace;color:var(--ac);font-weight:600">¥' + billOrdAmountStr(o) + '</span>'
    + '</div>';
  if (img) {
    info += '<div style="margin-top:.85rem"><div style="font-size:.68rem;color:var(--t3);margin-bottom:.35rem">' + t('billImage') + '</div>'
      + '<img src="' + safeUrl(img) + '" style="width:100%;max-height:320px;object-fit:contain;border-radius:8px;border:1px solid var(--bd);cursor:zoom-in;background:var(--bg3)" onclick="openBillImg(\'' + safeUrl(img) + '\')" /></div>';
  }
  if (!reviewed) {
    info += '<div class="fgm" style="margin-top:1rem"><label>💰 ' + t('billAmount') + ' *</label>'
      + '<input type="text" inputmode="decimal" id="payBillAmt" placeholder="' + amt.toFixed(2) + '" />'
      + '<div style="font-size:.62rem;color:var(--t3);margin-top:.25rem">' + t('billAmountHint') + '</div></div>';
  }
  document.getElementById('payInfo').innerHTML = info;
  const foot = document.querySelector('#paymo .mf');
  if (foot) {
    if (reviewed) {
      foot.innerHTML = '<button class="btn bg bs" onclick="cMo(\'paymo\')">' + t('close') + '</button>';
    } else {
      foot.innerHTML = '<button class="btn bg bs" onclick="cMo(\'paymo\')">' + t('cancel') + '</button>'
        + '<button class="btn bs aw" style="background:var(--sf);color:#fff" onclick="confirmPayWithAmt()">' + t('confirmPayment') + '</button>';
    }
  }
  oMo('paymo');
}

async function confirmPayWithAmt() {
  const id = parseInt(document.getElementById('payOid').value);
  const el = document.getElementById('payBillAmt');
  const raw = ((el && el.value) || '').trim().replace(/[¥,\s]/g, '');
  if (!raw || isNaN(Number(raw)) || Number(raw) <= 0) {
    toast(t('billAmountRequired') || t('billAmount'), 'er');
    return;
  }
  const o = DB.ords.find(x => x.id === id);
  if (!o) return;
  try {
    const patch = { payment_status: 'confirmed' };
    const noteAmt = 'bill_paid:' + Number(raw).toFixed(2);
    patch.note = ((o.note || '') + (o.note ? ' | ' : '') + noteAmt);
    if (o.src === 'shop') {
      await adminApi('update', { table: 'shop_orders', patch: patch, where: { id: Number(o.shopId) } });
    } else {
      await adminFrom('orders').update(patch).eq('id', id);
    }
    await loadAllData();
    cMo('paymo');
    toast(t('confirmed'), 'ok');
    render(curP);
  } catch (err) { toast(t('opFailed') + ': ' + (err && err.message || err), 'er'); }
}

function rShipAddr() {
  return '<div class="pnl"><div class="pnH"><span class="pnT">📍 ' + t('shipAddrSettings') + '</span><span style="font-size:.65rem;color:var(--t3)">' + t('shipAddrInfo') + '</span></div><div class="pnB" id="shipAddrArea"><div class="spinner"></div></div></div>';

async function loadShipAddrSettings() {
  try {
    const { data } = await sb.from('site_settings').select('*').in('key', ['addr_motoboy', 'addr_correios']);
    const map = {};
    (data || []).forEach(r => { map[r.key] = r.value || ''; });
    const area = document.getElementById('shipAddrArea');
    if (!area) return;
    area.innerHTML = ''
      + '<div class="fgm"><label>🏍️ ' + t('addrMotoboy') + '</label><textarea id="ps_addr_motoboy" placeholder="' + t('addrMotoboyPH') + '" style="min-height:52px">' + esc(map.addr_motoboy || '') + '</textarea></div>'
      + '<div class="fgm"><label>📮 ' + t('addrCorreios') + '</label><textarea id="ps_addr_correios" placeholder="' + t('addrCorreiosPH') + '" style="min-height:52px">' + esc(map.addr_correios || '') + '</textarea></div>'
      + '<div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem"><button class="btn bp bs aw" onclick="saveShipAddrSettings()">💾 ' + t('saveSettings') + '</button></div>';
  } catch (e) { console.error('Load ship addr error:', e); }
}

async function saveShipAddrSettings() {
  try {
    for (const key of ['addr_motoboy', 'addr_correios']) {
      const el = document.getElementById('ps_' + key);
      if (!el) continue;

function syncPayTierInputs() {
  const tiers = window._payTiers || [];
  tiers.forEach((tr, i) => {

    tr.max = max === '' ? null : Number(max);
    tr.pix = g('ptr_pix_' + i);
    tr.bank_name = g('ptr_bank_name_' + i);

async function reviewCus(id, status) {
  try {
    await adminFrom('customers').update({ status, approved_by: user.u }).eq('id', id);
    await loadAllData();
    toast(t('reviewDone'), 'ok');
    render('approvals');
  } catch (err) { toast(t('opFailed') + ': ' + err.message, 'er'); }
}

async function reviewCusChange(reqId, decision) {
  const reqs = (DB.cusReqs || []).slice();
  const idx = reqs.findIndex(r => String(r.id) === String(reqId));
  if (idx < 0) return;
  const r = reqs[idx];
  try {
    if (decision === 'approved' && r.patch) {
      const patch = Object.assign({}, r.patch);
      await adminApi('update', { table: 'customers', patch: patch, where: { id: Number(r.customer_id) } });
    }
    reqs[idx] = Object.assign({}, r, {
      status: decision === 'approved' ? 'approved' : 'rejected',
      reviewed_by: user.u,
      reviewed_at: new Date().toISOString()
    });
    await saveCusReqs(reqs);
    DB.cusReqs = reqs;
    await loadAllData();
    toast(decision === 'approved' ? t('cusChangeApplied') : t('cusChangeRejected'), 'ok');
    render('approvals');
  } catch (err) { toast(t('opFailed') + ': ' + (err && err.message || err), 'er'); }
}

async function saveCusReqs(reqs) {
  const val = JSON.stringify(reqs || []);
  const { data: existing } = await sb.from('site_settings').select('key').eq('key', 'cus_change_reqs').limit(1);
  if (existing && existing.length) {
    await adminFrom('site_settings').update({ value: val, updated_at: new Date().toISOString() }).eq('key', 'cus_change_reqs');
  } else {
    await adminFrom('site_settings').insert({ key: 'cus_change_reqs', value: val, label: 'cus_change_reqs' });
  }
}

async function reviewChange(id, status, newM, cost, oid) {
  try {
    await adminFrom('order_changes').update({ status, reviewed_by: user.u }).eq('id', id);
    if (status === 'approved') {
      await adminFrom('orders').update({ pickup_method: newM, shipping_cost: cost }).eq('id', oid);
    }
    await loadAllData();
    toast(t('reviewDone'), 'ok');
    render('approvals');
  } catch (err) { toast(t('opFailed') + ': ' + err.message, 'er'); }
}

function initNO() {
  renderOrdItems();
  renderOrdPics();
  if (dPk) document.querySelectorAll('.pk[data-pk]').forEach(el => el.classList.toggle('on', el.dataset.pk === dPk));
  if (dPayMethod) document.querySelectorAll('.pk[data-pay]').forEach(el => el.classList.toggle('on', el.dataset.pay === dPayMethod));
  if (dCustId) { const sel = document.getElementById('ordCus'); if (sel) sel.value = dCustId; onCusChange(); }
  if (dEditId) document.getElementById('drBadge').style.display = '';
  if (dShipAddr && dPk && (dPk === 'motoboy' || dPk === 'correios' || dPk === 'onibus')) { document.getElementById('addrSec').style.display = ''; document.getElementById('ordAddr').value = dShipAddr; }
  if (dPk === 'onibus') {
    const onSec = document.getElementById('onibusSec');
    if (onSec) onSec.style.display = '';
    if (dOnibName) { const el = document.getElementById('ordOnibusName'); if (el) el.value = dOnibName; }
    if (dOnibusImg) { const b = document.getElementById('onIB'); if (b) b.innerHTML = '<img src="' + safeUrl(dOnibusImg) + '" /><span class="ir" onclick="event.stopPropagation();dOnibusImg=\'\';rmImg(\'dOnibusImg\',\'onIB\')">×</span>'; }
  }
}

function onCusChange() {
  const sel = document.getElementById('ordCus');
  dCustId = sel.value ? parseInt(sel.value) : '';
  const info = document.getElementById('cusInfo');
  if (!dCustId) { info.innerHTML = ''; return; }
  const c = cusById(dCustId);
  if (!c) return;
  const avail = c.creditLimit - c.creditUsed;
  const stC = CUSTAT[c.status] || {};
  info.innerHTML = '<strong>' + esc(c.name) + '</strong> · ' + esc(c.phone)
    + ' <span class="badge ' + stC.c + '">' + t(stC.l || c.status) + '</span><br>'
    + t('creditLimit') + ': ¥' + c.creditLimit.toLocaleString() + ' · ' + t('creditUsed') + ': ¥' + c.creditUsed.toLocaleString() + ' · <span style="color:' + (avail > 0 ? 'var(--sf)' : 'var(--dg)') + '">' + t('available') + ': ¥' + avail.toLocaleString() + '</span>'
    + ((c.motoAddr || c.corrAddr) ? '<br><span style="color:var(--t3)">🏍️ ' + esc(c.motoAddr || '-') + ' · 📮 ' + esc(c.corrAddr || '-') + '</span>' : '');
  updateCreditInfo();
}

function selPk(pk) {
  dPk = pk;
  document.querySelectorAll('.pk[data-pk]').forEach(el => el.classList.toggle('on', el.dataset.pk === pk));
  const addrSec = document.getElementById('addrSec');
  const onibusSec = document.getElementById('onibusSec');
  // Address section: for motoboy, correios, and onibus
  if (pk === 'motoboy' || pk === 'correios' || pk === 'onibus') {
    addrSec.style.display = '';
    if (dCustId) {
      const c = cusById(dCustId);
      if (c) {
        const addr = pk === 'motoboy' ? c.motoAddr : (pk === 'onibus' ? c.motoAddr : c.corrAddr);
        if (addr && !dShipAddr) { document.getElementById('ordAddr').value = addr; dShipAddr = addr; }
        if (!addr) toast(t('addressNotSet', pk === 'motoboy' ? 'Motoboy' : (pk === 'onibus' ? 'Ônibus' : 'Correios')), 'inf');
      }
    }
  } else { addrSec.style.display = 'none'; }
  // Onibus section
  if (onibusSec) onibusSec.style.display = pk === 'onibus' ? '' : 'none';
}

function selPay(m) {
  dPayMethod = m;
  document.querySelectorAll('.pk[data-pay]').forEach(el => el.classList.toggle('on', el.dataset.pay === m));
  document.getElementById('payOpt').style.display = m === 'cash' ? '' : 'none';
  updateCreditInfo();
}

function updateCreditInfo() {
  const info = document.getElementById('creditInfo');
  if (!info) return;
  if (dPayMethod === 'credit' && dCustId) {
    const c = cusById(dCustId);
    if (c) {
      const avail = c.creditLimit - c.creditUsed;
      const total = dItems.reduce((s, it) => { const p = prodById(it.pid); return s + (p ? p.price * it.qty : 0); }, 0);
      info.style.display = '';
      if (avail >= total) { info.innerHTML = '✓ ' + t('creditDeduct') + ': ¥' + (avail - total).toLocaleString(); info.style.color = 'var(--sf)'; }
      else if (avail > 0) { info.innerHTML = '⚠️ ' + t('needExtraPay') + ': ¥' + (total - avail).toLocaleString(); info.style.color = 'var(--dg)'; }
      else { info.innerHTML = '❌ ' + t('creditUsedUp'); info.style.color = 'var(--dg)'; }
    }
  } else { info.style.display = 'none'; }
}

function selPayUpload(v) {
  dPayUpload = v;
  document.getElementById('payImgSec').style.display = v === 'yes' ? '' : 'none';
  const btns = document.querySelectorAll('#payOpt .btn');
  if (btns.length >= 2) { btns[0].className = 'btn bs ' + (v === 'yes' ? 'bp' : 'bg'); btns[1].className = 'btn bs ' + (v === 'no' ? 'bp' : 'bg'); }
}

function ordSearch() {
  const q = (document.getElementById('ordS')?.value || '').toLowerCase().trim();
  const el = document.getElementById('ordSR');
  if (!q) { el.innerHTML = ''; return; }
  const rs = DB.prods.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || (p.catIds || []).some(cid => { const c = catById(cid); return c && (c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)); })).slice(0, 8);
  if (!rs.length) { el.innerHTML = '<div class="srl"><div style="padding:.8rem;text-align:center;color:var(--t3)">' + t('noMatch') + '</div></div>'; return; }
  el.innerHTML = '<div class="srl">' + rs.map(p => {
    const ic = dItems.find(i => i.pid === p.id);
    const sc = p.stock === 0 ? 'var(--dg)' : p.stock <= 10 ? 'var(--wa)' : 'var(--sf)';
    const icon = (catById((p.catIds || [])[0]) || { icon: '📦' }).icon;
    return '<div class="sri" onclick="addOrdItem(' + p.id + ')"><span class="srI">' + icon + '</span><div style="flex:1;min-width:0"><div class="srN">' + esc(p.name) + '</div><div class="srD">' + esc(p.sku) + ' · ¥' + p.price.toLocaleString() + '</div></div><span class="srS" style="color:' + sc + '">' + (p.stock === 0 ? t('outOfStock') : t('stock') + ':' + p.stock) + '</span>' + (ic ? '<span style="font-size:.6rem;color:var(--ac)">×' + ic.qty + '</span>' : '') + '</div>';
  }).join('') + '</div>';
}

function addOrdItem(pid) {
  const p = prodById(pid);
  if (!p) return;
  if (p.sizes && p.sizes.length) {
    openSizePicker(pid);
    return;
  }
  const ex = dItems.find(i => i.pid === pid && !i.size);
  if (ex) ex.qty++; else dItems.push({ pid, qty: 1, size: '' });
  renderOrdItems();
  document.getElementById('ordS').value = '';
  document.getElementById('ordSR').innerHTML = '';
  updateCreditInfo();
}

function openSizePicker(pid) {
  const p = prodById(pid);
  if (!p) return;
  let el = document.getElementById('sizePickerModal');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sizePickerModal';
    el.className = 'mo';
    el.style.display = 'none';
    document.body.appendChild(el);
  }
  const ss = p.sizeStock || p.size_stock || {};
  const sizes = (p.sizes || []).slice();
  const chips = sizes.map(sz => {
    const left = Number(ss[sz] || 0);
    const disabled = left <= 0;
    return '<button type="button" class="btn bs" '
      + 'style="margin:.25rem;min-width:3rem;'
      + (disabled ? 'opacity:.4;cursor:not-allowed;' : 'cursor:pointer;')
      + '" '
      + (disabled ? 'disabled' : 'onclick="pickOrdSize(' + pid + ',\'' + String(sz).replace(/'/g, "\\'") + '\')"')
      + '>' + esc(String(sz)) + ' (' + left + ')</button>';
  }).join('');
  el.innerHTML = '<div class="mdl" style="max-width:420px"><div class="mh"><span class="mt">'
    + esc(p.name) + ' · ' + t('selectSize') + '</span>'
    + '<button class="mx" onclick="closeSizePicker()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'
    + '<div class="mb">' + chips
    + '<div style="font-size:.7rem;color:var(--t3);margin-top:.6rem">' + t('selectSizeHint') + '</div>'
    + '</div><div class="mf"><button class="btn bg bs" onclick="closeSizePicker()">' + t('close') + '</button></div></div>';
  el.style.display = 'flex';
}

function closeSizePicker() {
  const el = document.getElementById('sizePickerModal');
  if (el) el.style.display = 'none';
}

function pickOrdSize(pid, size) {
  const ex = dItems.find(i => i.pid === pid && i.size === size);
  if (ex) ex.qty++; else dItems.push({ pid, qty: 1, size: size || '' });
  closeSizePicker();
  renderOrdItems();
  document.getElementById('ordS').value = '';
  document.getElementById('ordSR').innerHTML = '';
  updateCreditInfo();
}

function renderOrdItems() {
  const el = document.getElementById('ordItems');
  if (!el) return;
  if (!dItems.length) { el.innerHTML = '<div class="oi-empty">' + t('selectItems') + '</div>'; return; }
  el.innerHTML = dItems.map((it, idx) => {
    const p = prodById(it.pid);
    if (!p) return '';
    const sc = p.stock === 0 ? 'var(--dg)' : p.stock <= 10 ? 'var(--wa)' : 'var(--sf)';
    const icon = (catById((p.catIds || [])[0]) || { icon: '📦' }).icon;
    return '<div class="oi-row"><span>' + icon + '</span><span class="oin">' + esc(p.name) + (it.size ? ' (' + esc(it.size) + ')' : '') + '</span><span class="oisk">' + esc(p.sku) + '</span><span class="oist" style="color:' + sc + '">' + t('stock') + ':' + p.stock + '</span><input type="number" value="' + it.qty + '" min="1" onchange="updOQ(' + idx + ',this.value)" /><button class="oid" onclick="rmOI(' + idx + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
  }).join('');
}

function updOQ(i, v) { if (dItems[i]) dItems[i].qty = Math.max(1, parseInt(v) || 1); updateCreditInfo(); }
function rmOI(i) { dItems.splice(i, 1); renderOrdItems(); updateCreditInfo(); }
function renderOrdPics() {
  if (dOI) { const b = document.getElementById('oIB'); if (b) b.innerHTML = '<img src="' + dOI + '" /><span class="ir" onclick="event.stopPropagation();dOI=\'\';rmImg(\'dOI\',\'oIB\')">×</span>'; }
  if (dBI) { const b = document.getElementById('bIB'); if (b) b.innerHTML = '<img src="' + dBI + '" /><span class="ir" onclick="event.stopPropagation();dBI=\'\';rmImg(\'dBI\',\'bIB\')">×</span>'; }
  if (dPayImg) { const b = document.getElementById('payIB'); if (b) b.innerHTML = '<img src="' + safeUrl(dPayImg) + '" /><span class="ir" onclick="event.stopPropagation();dPayImg=\'\';rmImg(\'dPayImg\',\'payIB\')">×</span>'; }
}

// ═══════════════════════════════════════
// ORDER SUBMIT / SAVE
// ═══════════════════════════════════════
function buildOrderRow() {
  const total = dItems.reduce((s, it) => { const p = prodById(it.pid); return s + (p ? p.price * it.qty : 0); }, 0);
  const hasBill = dPayImg && dPayUpload === 'yes';
  return {
    order_no: genOrdNo(), pickup_method: dPk || 'motoboy',
    order_image: dOI, bill_image: dBI, note: dNote, created_by: user.u,
    payment_method: dPayMethod,
    payment_status: hasBill ? 'pending' : 'pending_bill',
    payment_image: dPayImg || '', payment_upload: dPayUpload,
    bill_deadline: hasBill ? null : new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString(),
    original_total: total,
    customer_id: dCustId || null, shipping_address: dShipAddr,
    onibus_name: dPk === 'onibus' ? dOnibName : '',
    onibus_schedule_img: dPk === 'onibus' ? dOnibusImg : ''
  };
}

async function saveDraft() {
  if (!dItems.length && !dPk) { toast(t('selectItemsErr'), 'er'); return; }
  try {
    const row = { ...buildOrderRow(), status: 'draft' };
    let ordId;
    if (dEditId) { await adminFrom('orders').update(row).eq('id', dEditId); ordId = dEditId; await adminFrom('order_items').delete().eq('order_id', dEditId); }
    else { const { data, error } = await adminFrom('orders').insert(row).select().single(); if (error) throw error; ordId = data.id; }
    if (dItems.length) await adminFrom('order_items').insert(dItems.map(i => ({ order_id: ordId, product_id: i.pid, qty: i.qty, original_price: Number((prodById(i.pid) || {}).price) || 0 })));
    await loadAllData();
    toast(t('draftSaved'), 'ok');
    clearDraft();
    goPage('sOrds');
  } catch (err) { toast(t('submitFailed') + ': ' + err.message, 'er'); }
}

async function submitOrd() {
  if (!dItems.length) { toast(t('selectItemsErr'), 'er'); return; }
  if (!dPk) { toast(t('selectMethodErr'), 'er'); return; }
  if (dPayMethod === 'credit' && !dCustId) { toast(t('creditMustCustomer'), 'er'); return; }
  if (dPayMethod === 'credit' && dCustId) {
    const c = cusById(dCustId);
    if (c) {
      const avail = c.creditLimit - c.creditUsed;
      const total = dItems.reduce((s, it) => { const p = prodById(it.pid); return s + (p ? p.price * it.qty : 0); }, 0);
      if (avail <= 0) { toast(t('creditUsedUp'), 'er'); return; }
      if (avail < total) toast(t('insufficientCredit', (total - avail).toLocaleString()), 'inf');
    }
  }
  for (const it of dItems) {
    const p = prodById(it.pid);
    if (!p) { toast(t('deleted'), 'er'); return; }
    if (it.qty > p.stock) { toast(p.name + ' ' + t('insufficient', p.stock), 'er'); return; }
  }
  try {
    const row = { ...buildOrderRow(), status: 'pending' };
    let ordId;
    if (dEditId) { await adminFrom('orders').update(row).eq('id', dEditId); ordId = dEditId; await adminFrom('order_items').delete().eq('order_id', dEditId); }
    else { const { data, error } = await adminFrom('orders').insert(row).select().single(); if (error) throw error; ordId = data.id; }
    if (dItems.length) await adminFrom('order_items').insert(dItems.map(i => ({ order_id: ordId, product_id: i.pid, qty: i.qty, original_price: Number((prodById(i.pid) || {}).price) || 0 })));
    // Lock stock immediately (atomic, guarded against oversell)
    for (const it of dItems) {
      const { error: dErr } = await sb.rpc('decrement_stock', { pid: it.pid, amount: it.qty });
      if (dErr) throw new Error('STOCK:' + it.pid + ':' + (dErr.message || dErr));
    }
    await loadAllData();
    toast(t('orderSubmitted'), 'ok');
    clearDraft();
    goPage('sOrds');
  } catch (err) { toast(t('submitFailed') + ': ' + err.message, 'er'); }
}

function clearDraft() {
  dItems = []; dPk = ''; dOI = ''; dBI = ''; dNote = ''; dEditId = null; dOnibName = ''; dOnibusImg = '';
  dCustId = ''; dPayMethod = 'cash'; dPayUpload = 'yes'; dPayImg = ''; dShipAddr = '';
}

// ═══════════════════════════════════════
// SALES ORDER LIST
// ═══════════════════════════════════════
function rSOrds() {
  const ords = [...DB.ords].filter(o => o.by === user.u).sort((a, b) => b.cr.localeCompare(a.cr));
  let tb = '';
  if (!ords.length) { tb = '<tr><td colspan="7"><div class="empty"><p>' + t('noOrders') + '</p></div></td></tr>'; }
  else {
    tb = ords.map(o => {
      const sc = OSTAT[o.st] || {};
      const pk = PICKUPS[o.pk] || {};
      const paySc = PSTAT[o.payS] || {};
      const its = o.items.map(i => { const p = prodById(i.pid); return p ? p.name + '×' + i.qty : t('deleted'); }).join(', ');
      let ac = '<button class="bi" title="' + t('view') + '" onclick="viewOrd(' + o.id + ')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>';
      if (o.st === 'draft') {
        ac += '<button class="bi" title="' + t('editDraft') + '" onclick="editDraft(' + o.id + ')" style="color:var(--ac)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';
        ac += '<button class="bi" title="' + t('deleteDraft') + '" onclick="delOrd(' + o.id + ')" style="color:var(--dg)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>';
      }
      if (o.st === 'picking' || o.st === 'done') {
        ac += '<button class="bi" title="' + t('applyChange') + '" onclick="openChangeReq(' + o.id + ')" style="color:var(--wa)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>';
      }
      return '<tr><td><strong>' + esc(o.no) + '</strong></td><td style="max-width:150px;white-space:normal;font-size:.72rem">' + esc(its) + '</td><td>' + (pk.i || '') + ' ' + t(OSTAT[o.st]?.l || o.st) + '</td><td><span class="badge ' + sc.c + '">' + t(sc.l) + '</span></td><td><span class="badge ' + paySc.c + '">' + t(paySc.l || 'pendingConfirm') + '</span></td><td style="font-family:DM Mono,monospace;font-size:.68rem;color:var(--t3)">' + esc(o.cr) + '</td><td><div class="ac">' + ac + '</div></td></tr>';
    }).join('');
  }
  return '<div class="tw"><div class="ts"><table><thead><tr><th>' + t('orderNo') + '</th><th>' + t('items') + '</th><th>' + t('pickup') + '</th><th>' + t('status') + '</th><th>' + t('payment') + '</th><th>' + t('createdAt') + '</th><th>' + t('action') + '</th></tr></thead><tbody>' + tb + '</tbody></table></div></div>';
}

function editDraft(id) {
  const o = DB.ords.find(x => x.id === id);
  if (!o || o.st !== 'draft') return;
  dEditId = o.id; dItems = o.items.map(i => ({ ...i })); dPk = o.pk;
  dOI = o.oi || ''; dBI = o.bi || ''; dNote = o.note || '';
  dCustId = o.custId || ''; dPayMethod = o.payM || 'cash';
  dPayUpload = o.payU || 'yes'; dPayImg = o.payI || ''; dShipAddr = o.shipAddr || '';
  dOnibName = o.onibusName || ''; dOnibusImg = o.onibusImg || '';
  goPage('sNewOrd');
}

async function delOrd(id) {
  const o = DB.ords.find(x => x.id === id);
  if (!o || o.st !== 'draft') return;
  if (!confirm(t('confirmDeleteDraft'))) return;
  try { await adminFrom('orders').delete().eq('id', id); await loadAllData(); render('sOrds'); } catch (err) { toast(t('deleteFailed'), 'er'); }
}

// ═══════════════════════════════════════
// SALES PRODUCT QUERY
// ═══════════════════════════════════════
function rSProds() {
  return '<div class="tb"><div class="sbox" style="width:100%"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="spS" placeholder="' + t('searchProduct') + '" oninput="doSPSearch()" autofocus /></div></div><div id="spR"><div class="empty"><p>' + t('searchPrice') + '</p></div></div>';
}

function doSPSearch() {
  const q = (document.getElementById('spS')?.value || '').toLowerCase().trim();
  const el = document.getElementById('spR');
  if (!q) { el.innerHTML = '<div class="empty"><p>' + t('searchProduct') + '</p></div>'; return; }
  const rs = DB.prods.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || (p.catIds || []).some(cid => { const c = catById(cid); return c && (c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)); }));
  if (!rs.length) { el.innerHTML = '<div class="empty"><p>' + t('noMatch') + '</p></div>'; return; }
  el.innerHTML = rs.map(p => {
    const st = p.stock === 0 ? '<span style="color:var(--dg);font-weight:600">' + t('outOfStock') + '</span>' : p.stock <= 10 ? '<span style="color:var(--wa)">' + t('onlyLeft', p.stock) + '</span>' : '<span style="color:var(--sf)">' + t('inStock', p.stock) + '</span>';
    return '<div class="pnl" style="margin-bottom:.5rem"><div class="pnB" style="display:flex;align-items:center;gap:.8rem"><div class="pimg" style="width:48px;height:48px;flex-shrink:0">' + (p.img ? '<img src="' + safeUrl(p.img) + '" alt="" onerror="this.remove()">' : '') + '</div><div style="flex:1;min-width:0"><div style="font-weight:500">' + esc(p.name) + '</div><div style="font-size:.68rem;color:var(--t3)">' + esc(p.sku) + ' · ' + catTagsP(p, true) + '</div></div><div style="text-align:right;flex-shrink:0"><div style="font-family:DM Mono,monospace;font-weight:600">¥' + p.price.toLocaleString() + '</div><div style="font-size:.72rem">' + st + '</div></div></div></div>';
  }).join('');
}

// ═══════════════════════════════════════
// CUSTOMER MANAGEMENT
// ═══════════════════════════════════════
function salesCusPool() {
  return DB.cus.filter(c => c.by === user.u || String(c.status || '').toLowerCase() === 'approved');
}
function rSCus() {
  const myCus = salesCusPool();
  let rows = myCus.map(c => {
    const stC = CUSTAT[c.status] || {};
    const avail = c.creditLimit - c.creditUsed;
    return '<tr style="cursor:pointer" onclick="openCusDetail(' + c.id + ')"><td><strong>' + esc(c.name) + '</strong></td><td style="font-family:DM Mono,monospace">¥' + c.creditLimit.toLocaleString() + '</td><td style="font-family:DM Mono,monospace;color:' + (avail > 0 ? 'var(--sf)' : 'var(--dg)') + '">¥' + avail.toLocaleString() + '</td><td><span class="badge ' + stC.c + '">' + t(stC.l || c.status) + '</span></td><td style="font-size:.68rem;color:var(--t3)">' + esc(c.cr) + '</td></tr>';
  }).join('');
  if (!myCus.length) rows = '<tr><td colspan="5"><div class="empty"><p>' + t('noCustomers') + '</p></div></td></tr>';
  return '<div class="tb"><span class="tbsp"></span><button class="btn bp bs aw" onclick="openAddCus()">+ ' + t('addCustomer') + '</button></div><div class="tw"><div class="ts"><table><thead><tr><th>' + t('customerName') + '</th><th>' + t('creditLimit') + '</th><th>' + t('available') + '</th><th>' + t('status') + '</th><th>' + t('createdDate') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

function openCusDetail(id) {
  const c = cusById(id);
  if (!c) return;
  document.getElementById('cusDT').textContent = t('cusDetail') + ' · ' + c.name;
  document.getElementById('cusDId').value = c.id;
  document.getElementById('cusDNm').value = c.name || '';
  document.getElementById('cusDPh').value = c.phone || '';
  document.getElementById('cusDMA').value = c.motoAddr || '';
  document.getElementById('cusDCA').value = c.corrAddr || '';
  document.getElementById('cusDCL').value = c.creditLimit || 0;
  const reqs = (DB.cusReqs || []).filter(r => Number(r.customer_id) === Number(c.id) && r.status === 'pending');
  const done = (DB.cusReqs || []).filter(r => Number(r.customer_id) === Number(c.id) && r.status !== 'pending').slice(0, 5);
  let reqHtml = '';
  if (reqs.length) reqHtml += '<div style="margin:.6rem 0;padding:.55rem .75rem;border:1px dashed var(--wa);border-radius:var(--r);font-size:.72rem;color:var(--wa)">' + t('cusChangePending') + '</div>';
  if (done.length) {
    reqHtml += '<div style="margin:.6rem 0;font-size:.68rem;color:var(--t3)">' + t('cusChangeLog') + '</div>';
    reqHtml += done.map(r => {
      const cols = Object.keys(r.patch || {}).map(k => '<div style="font-size:.66rem">' + esc(k) + ': ' + esc(String((r.old || {})[k] ?? '')) + ' → ' + esc(String((r.patch || {})[k] ?? '')) + '</div>').join('');
      return '<div style="padding:.35rem 0;border-bottom:1px solid var(--bd)"><span class="badge ' + (r.status === 'approved' ? 'b-dn' : 'b-cn') + '">' + t(r.status === 'approved' ? 'approved' : 'rejected') + '</span> ' + esc(r.reviewed_at || r.requested_at || '') + cols + '</div>';
    }).join('');
  }
  document.getElementById('cusDReq').innerHTML = reqHtml;
  document.getElementById('cusDFoot').innerHTML =
    (reqs.length ? '' : '<button class="btn bp bs aw" onclick="submitCusChange()">' + t('submitCusChange') + '</button>')
    + '<button class="btn bg bs" onclick="cMo(\'cusDmo\')">' + t('close') + '</button>';
  oMo('cusDmo');
}

async function submitCusChange() {
  const id = Number(document.getElementById('cusDId').value);
  const c = cusById(id);
  if (!c) return;
  const patch = {
    name: (document.getElementById('cusDNm').value || '').trim(),
    phone: (document.getElementById('cusDPh').value || '').trim(),
    moto_address: (document.getElementById('cusDMA').value || '').trim(),
    correio_address: (document.getElementById('cusDCA').value || '').trim(),
    credit_limit: parseFloat(document.getElementById('cusDCL').value) || 0
  };
  const old = {
    name: c.name || '', phone: c.phone || '', moto_address: c.motoAddr || '',
    correio_address: c.corrAddr || '', credit_limit: c.creditLimit || 0
  };
  const changed = Object.keys(patch).some(k => String(patch[k] ?? '') !== String(old[k] ?? ''));
  if (!changed) { toast(t('editCusInfo'), 'inf'); return; }
  try {
    const reqs = (DB.cusReqs || []).slice();
    reqs.unshift({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      customer_id: c.id,
      customer_name: c.name,
      requested_by: user.u,
      patch, old,
      status: 'pending',
      requested_at: new Date().toISOString(),
      reviewed_by: '', reviewed_at: '', review_note: ''
    });
    await saveCusReqs(reqs);
    DB.cusReqs = reqs;
    cMo('cusDmo');
    toast(t('cusChangeSubmitted'), 'ok');
    render(curP);
  } catch (err) { toast(t('saveFailed') + ': ' + (err && err.message || err), 'er'); }
}

function openAddCus() {
  document.getElementById('cusT').textContent = t('addCustomer');
  document.getElementById('cusId').value = '';
  ['cusNm', 'cusPh', 'cusMA', 'cusCA', 'cusCL'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  oMo('cusmo');
}

async function saveCus() {
  const name = document.getElementById('cusNm').value.trim();
  if (!name) { toast(t('customerName'), 'er'); return; }
  const phone = document.getElementById('cusPh').value.trim();
  const motoAddr = document.getElementById('cusMA').value.trim();
  const corrAddr = document.getElementById('cusCA').value.trim();
  const creditLimit = parseFloat(document.getElementById('cusCL').value) || 0;
  try {
    if (!ADMIN_TOKEN) throw new Error('no_token');
    await adminApi('insert', {
      table: 'customers',
      row: {
        name, phone, moto_address: motoAddr, correio_address: corrAddr,
        credit_limit: creditLimit, credit_used: 0, status: 'pending', created_by: user.u
      }
    });
    await loadAllData();
    cMo('cusmo');
    toast(t('customerCreated'), 'ok');
    render('sCus');
  } catch (err) {
    const msg = String(err && err.message || err);
    if (msg === 'no_token' || msg === 'bad_token' || /admin_api_401/.test(msg)) {
      toast((t('wrongCreds') || '登录已失效') + ' / session expired', 'er');
      try { doLogout(); } catch (_) {}
      return;
    }
    toast(t('submitFailed') + ': ' + msg, 'er');
  }
}

// ═══════════════════════════════════════
// GLOBAL SEARCH
// ═══════════════════════════════════════
function gSearch(q) {
  if (user?.r === 'sales') {
    if (curP !== 'sProds') goPage('sProds');
    setTimeout(() => { const e = document.getElementById('spS'); if (e) { e.value = q; doSPSearch(); } }, 50);
  } else {
    if (curP !== 'inv') goPage('inv');
    setTimeout(() => { iSq = q; const e = document.getElementById('iS'); if (e) { e.value = q; iPg = 1; render('inv'); } }, 50);
  }
}

// ═══════════════════════════════════════
// APP INIT
// ═══════════════════════════════════════
(async () => {
  console.log('[CloudStock] 初始化...');
  applyLang();
  const s = sessionStorage.getItem('cs4');
  if (s) {
    try {
      const { id, pl, tk, exp } = JSON.parse(s);
      // P2-7: 会话过期检查
      if (exp && Date.now() > exp) {
        sessionStorage.removeItem('cs4');
        console.log('[CS] Session expired');
      } else if (tk) {
        initSb(tk);
        try {
          await adminApi('select', { table: 'products', limit: 1 });
        } catch (e) {
          sessionStorage.removeItem('cs4');
          initSb('');
        }
        if (ADMIN_TOKEN) {
          try {
            const { data } = await sb.rpc('app_list_accounts');
            const list = Array.isArray(data) ? data : [];
            const a = list.find(x => x.id === id && x.status === 'active');
            if (a && (a.role === 'wh_admin' || a.role === 'wh_staff' || a.role === 'sales')) {
              user = {
                id: a.id, u: a.username, n: a.display_name || '',
                r: a.role, s: a.status, perm: a.perms || {}, c: ''
              };
              portal = pl || 'wh';
            }
          } catch (e) {}
        }
      }
    } catch (e) { }
  }
  await loadAllData();
  console.log('[CloudStock] 账号:', DB.accts.length, '商品:', DB.prods.length, '客户:', DB.cus.length);
  if (user) enterApp();
})();

</script>
